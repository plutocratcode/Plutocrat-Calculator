<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
  <header>
    <h1>Plutocrat Calculator</h1>
  </header>
  <section>
    <input id="screen" type="txt">
  </section>
  <section>
    <button id="C">C</button>
    <button id="D">D</button>
    <button class="number">0</button>
    <button id="divide" class="arith">/</button>
  </section>
  <section>
    <button class="number">7</button>
    <button class="number">8</button>
    <button class="number">9</button>
    <button id="multiply" class="arith">*</button>
  </section>
  <section>
    <button class="number">4</button>
    <button class="number">5</button>
    <button class="number">6</button>
    <button id="minus" class="arith">-</button>
  </section>
  <section>
    <button class="number">1</button>
    <button class="number">2</button>
    <button class="number">3</button>
    <button id="plus" class="arith">+</button>
  </section>
  <section>
    <button id ="equal" class="equal">=</button>
  </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
